; Multilevel Mock — PHP sozlamalari. PHP-FPM / CGI / LiteSpeed hostinglarda .user.ini avtomatik o'qiladi
; (o'zgarish 5 daqiqagacha kechikishi mumkin). mod_php bo'lsa, shu qiymatlarni hosting panelidagi PHP sozlamalariga kiriting.
; Fayl brauzerdan ochilmaydi: public/.htaccess yashirin fayllarni 403 bilan yopadi.
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
memory_limit = 256M
display_errors = Off
log_errors = On
session.gc_maxlifetime = 43200

; Ixtiyoriy (tavsiya): PHP xatolari jurnali veb-ildizdan tashqarida. Papkani avval yarating, yo'lni o'zingiznikiga
; almashtiring va ";" belgisini olib tashlang. "Serverda xatolik" (500) sababi shu faylda "[mock]" bilan boshlanadi.
; error_log = "/home/FOYDALANUVCHI/mock/storage/logs/php-error.log"

; Ixtiyoriy: sessiyalar uchun alohida papka. Hostingdagi umumiy sessiya papkasi yozilmasa, kirishda doim
; "Sahifa eskirgan" xabari chiqadi — shunda shu qatorni yoqing (papkani avval yarating).
; session.save_path = "/home/FOYDALANUVCHI/mock/storage/sessions"
